<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Become a Gentle Path Driving Star! | Gentle Path Driving School</title>
  <meta name="description" content="Play Gentle Path Driving Instruction's learner-driver journey game.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="image" href="gp-icon-l-digital.png">
  <link rel="preload" as="image" href="gp-icon-p-digital.png">
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,400;0,600;0,700;0,800;1,700;1,800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --brand-green: #546d61;
      --brand-coral: #cd6a5b;
      --brand-gold: #d2be70;
      --brand-light: #ededed;
      --brand-charcoal: #383838;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 280px;
      background: var(--brand-green);
    }

    body {
      font-family: "Urbanist", Arial, sans-serif;
      color: var(--brand-light);
    }

    .game-section {
      min-height: 100vh;
      padding: 8px 16px;
      text-align: center;
      background: linear-gradient(180deg, var(--brand-green) 0%, var(--brand-charcoal) 100%);
      font-family: "Urbanist", Arial, sans-serif;
    }

    .game-heading {
      margin: 0 auto 2px;
      max-width: 440px;
      font-family: "Urbanist", Arial, sans-serif;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--brand-gold);
      font-family: "Urbanist", Arial, sans-serif;
      font-size: clamp(30px, 7vw, 42px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .canvas-frame {
      position: relative;
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      line-height: 0;
    }

    .canvas-frame::before,
    .canvas-frame::after {
      content: "";
      position: absolute;
      z-index: 1;
      top: 0;
      bottom: 0;
      width: 19px;
      background: var(--brand-charcoal);
      pointer-events: none;
    }

    .canvas-frame::before {
      left: 0;
    }

    .canvas-frame::after {
      right: 0;
    }

    .start-copy {
      position: absolute;
      z-index: 2;
      top: 52px;
      left: 50%;
      width: calc(100% - 40px);
      max-width: 340px;
      transform: translateX(-50%);
      pointer-events: none;
      font-family: "Urbanist", Arial, sans-serif;
      line-height: 1.15;
      text-align: center;
    }

    .start-copy.is-hidden {
      display: none;
    }

    .start-title {
      margin: 0 0 18px;
      color: var(--brand-gold);
      font-size: clamp(30px, 7vw, 40px);
      font-weight: 800;
      line-height: 1.04;
    }

    .start-intro {
      margin: 0;
      color: rgba(237, 237, 237, 0.9);
      font-size: clamp(15px, 3.7vw, 20px);
      font-weight: 600;
      line-height: 1.25;
    }

    .game-status-slot {
      display: flex;
      width: 380px;
      max-width: 100%;
      min-height: 0;
      margin: 0 auto;
      align-items: flex-end;
    }

    .game-status {
      --status-color: #d2be70;
      width: 100%;
      min-height: 74px;
      padding: 10px 14px 9px;
      display: none;
      visibility: hidden;
      border: 2.5px solid var(--status-color);
      border-top-width: 4px;
      border-radius: 16px;
      background: rgba(56, 56, 56, 0.98);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      opacity: 0;
      line-height: 1.25;
      transform: translateY(5px);
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms;
      font-family: "Urbanist", Arial, sans-serif;
    }

    .game-status.is-visible {
      display: block;
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
      margin-bottom: 6px;
    }

    .game-status-title {
      margin: 0;
      color: var(--status-color);
      font-family: "Urbanist", Arial, sans-serif;
      font-size: 18px;
      font-weight: 800;
    }

    .game-status-detail {
      margin: 5px 0 0;
      color: rgba(237, 237, 237, 0.92);
      font-family: "Urbanist", Arial, sans-serif;
      font-size: 12px;
    }

    canvas {
      display: block;
      width: 380px;
      max-width: 100%;
      height: auto;
      touch-action: none;
    }

    canvas:focus-visible {
      outline: 3px solid var(--brand-gold);
      outline-offset: -4px;
    }

    @media (max-width: 430px) {
      .game-section {
        padding: 6px 10px;
      }

      .game-heading {
        margin-bottom: 2px;
      }

      .eyebrow {
        font-size: clamp(28px, 8vw, 38px);
      }

      .start-copy {
        top: 48px;
        width: calc(100% - 32px);
      }

      .start-title {
        font-size: clamp(28px, 8vw, 36px);
      }

      .start-intro {
        font-size: clamp(14px, 4vw, 18px);
      }

      .game-status-title {
        font-size: 16px;
      }
    }

    @media (orientation: landscape) and (max-width: 950px) and (pointer: coarse) {
      .game-section {
        min-height: 0;
        padding: 6px 10px;
      }

      .game-heading {
        display: none;
      }

      .game-status-slot {
        width: 640px;
        min-height: 0;
        margin: 0 auto;
      }

      .game-status {
        min-height: 70px;
        padding: 8px 14px;
      }

      .game-status-title {
        font-size: 18px;
      }

      .game-status-detail {
        margin-top: 5px;
        font-size: 12px;
      }

      .canvas-frame,
      canvas {
        width: 640px;
      }

      .start-copy {
        top: 24px;
        max-width: 540px;
      }

      .start-title {
        margin-bottom: 10px;
        font-size: 34px;
      }

      .start-intro {
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="game-section">
    <header class="game-heading">
      <h1 class="eyebrow"><em>Just For Fun...</em></h1>
    </header>

    <div class="game-status-slot">
      <section
        id="gpAnnouncement"
        class="game-status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        aria-hidden="true"
      >
        <p id="gpAnnouncementTitle" class="game-status-title"></p>
        <p id="gpAnnouncementDetail" class="game-status-detail"></p>
      </section>
    </div>

    <div class="canvas-frame">
      <div id="gpStartCopy" class="start-copy" aria-hidden="true">
        <h1 class="start-title">Become a Gentle Path Driving Star!</h1>
        <p class="start-intro">Collect the L and P plates along your journey.</p>
      </div>
      <canvas
        id="gpCanvas"
        width="380"
        height="540"
        tabindex="0"
        role="application"
        aria-label="Gentle Path driving journey game. Use the left and right arrow keys, or tap the left and right sides on a touchscreen."
      ></canvas>
    </div>
  </main>

  <script src="game-v2.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById('gpCanvas');
      const startCopy = document.getElementById('gpStartCopy');
      if (!canvas || !startCopy) return;

      function hideStartCopyOnStart(event) {
        const rect = canvas.getBoundingClientRect();
        const point = event.changedTouches ? event.changedTouches[0] : event;
        const x = (point.clientX - rect.left) * (canvas.width / (window.devicePixelRatio || 1)) / rect.width;
        const y = (point.clientY - rect.top) * (canvas.height / (window.devicePixelRatio || 1)) / rect.height;
        const logicalWidth = rect.width > rect.height ? 640 : 380;
        const logicalHeight = rect.width > rect.height ? 360 : 540;
        const scaledX = x * logicalWidth / (canvas.width / (window.devicePixelRatio || 1));
        const scaledY = y * logicalHeight / (canvas.height / (window.devicePixelRatio || 1));

        if (scaledX > logicalWidth / 2 - 84 && scaledX < logicalWidth / 2 + 84 && scaledY > logicalHeight / 2 + 30 && scaledY < logicalHeight / 2 + 78) {
          startCopy.classList.add('is-hidden');
        }
      }

      canvas.addEventListener('click', hideStartCopyOnStart);
      canvas.addEventListener('touchend', hideStartCopyOnStart, {passive: true});
    })();
  </script>
</body>
</html>
