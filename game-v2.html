<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Become a Gentle Path Driving Star! | Gentle Path Driving School</title>
  <meta name="description" content="Play Gentle Path Driving Instruction's learner-driver journey game.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="image" href="gp-icon-l-digital.png">
  <link rel="preload" as="image" href="gp-icon-p-digital.png">
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,400;0,600;0,700;0,800;1,700;1,800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --brand-green: #546d61;
      --brand-coral: #cd6a5b;
      --brand-gold: #d2be70;
      --brand-light: #ededed;
      --brand-charcoal: #383838;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 280px;
      background: var(--brand-green);
    }

    body {
      font-family: "Urbanist", Arial, sans-serif;
      color: var(--brand-light);
    }

    .game-section {
      min-height: 100vh;
      padding: 8px 16px;
      text-align: center;
      background: linear-gradient(180deg, var(--brand-green) 0%, var(--brand-charcoal) 100%);
      font-family: "Urbanist", Arial, sans-serif;
    }

    .game-heading {
      margin: 0 auto 6px;
      max-width: 440px;
      font-family: "Urbanist", Arial, sans-serif;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: var(--brand-gold);
      font-family: "Urbanist", Arial, sans-serif;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 3px;
      font-family: "Urbanist", Arial, sans-serif;
      font-size: clamp(24px, 5.4vw, 32px);
      font-weight: 700;
      line-height: 1.05;
    }

    .intro {
      margin: 0;
      color: rgba(237, 237, 237, 0.82);
      font-family: "Urbanist", Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
    }

    .canvas-frame {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      border: 2px solid rgba(210, 190, 112, 0.55);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      line-height: 0;
    }

    .game-status-slot {
      display: flex;
      width: 380px;
      max-width: 100%;
      min-height: 82px;
      margin: 0 auto 6px;
      align-items: flex-end;
    }

    .game-status {
      --status-color: #d2be70;
      width: 100%;
      min-height: 74px;
      padding: 10px 14px 9px;
      visibility: hidden;
      border: 2.5px solid var(--status-color);
      border-top-width: 4px;
      border-radius: 16px;
      background: rgba(56, 56, 56, 0.98);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      opacity: 0;
      line-height: 1.25;
      transform: translateY(5px);
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms;
      font-family: "Urbanist", Arial, sans-serif;
    }

    .game-status.is-visible {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
    }

    .game-status-title {
      margin: 0;
      color: var(--status-color);
      font-family: "Urbanist", Arial, sans-serif;
      font-size: 18px;
      font-weight: 800;
    }

    .game-status-detail {
      margin: 5px 0 0;
      color: rgba(237, 237, 237, 0.92);
      font-family: "Urbanist", Arial, sans-serif;
      font-size: 12px;
    }

    canvas {
      display: block;
      width: 380px;
      max-width: 100%;
      height: auto;
      touch-action: none;
    }

    canvas:focus-visible {
      outline: 3px solid var(--brand-gold);
      outline-offset: -4px;
    }

    .controls {
      margin: 0 0 6px;
      color: rgba(237, 237, 237, 0.72);
      font-family: "Urbanist", Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      line-height: 1.25;
    }

    @media (max-width: 430px) {
      .game-section {
        padding: 6px 10px;
      }

      .game-heading {
        margin-bottom: 5px;
      }

      .intro {
        font-size: 12px;
      }

      .game-status-title {
        font-size: 16px;
      }
    }

    @media (orientation: landscape) and (max-width: 950px) and (pointer: coarse) {
      .game-section {
        min-height: 0;
        padding: 6px 10px;
      }

      .game-heading {
        display: none;
      }

      .game-status-slot {
        width: 640px;
        min-height: 76px;
        margin-bottom: 6px;
      }

      .game-status {
        min-height: 70px;
        padding: 8px 14px;
      }

      .game-status-title {
        font-size: 18px;
      }

      .game-status-detail {
        margin-top: 5px;
        font-size: 12px;
      }

      .canvas-frame,
      canvas {
        width: 640px;
      }

      .canvas-frame {
        border-radius: 14px;
      }

      .controls {
        margin: 0 0 5px;
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="game-section">
    <header class="game-heading">
      <h3 class="eyebrow"><em>Just For Fun...</em></h3>
      <h1><strong>Become a Gentle Path Driving Star!</strong></h1>
      <h2 class="intro">Collect the L and P plates along your journey and don't forget to log your driving hours!</h2>
    </header>

    <p class="controls">use keyboard arrows ← → to drive &nbsp;·&nbsp; Tap left or right on mobile</p>

    <div class="game-status-slot">
      <section
        id="gpAnnouncement"
        class="game-status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        aria-hidden="true"
      >
        <p id="gpAnnouncementTitle" class="game-status-title"></p>
        <p id="gpAnnouncementDetail" class="game-status-detail"></p>
      </section>
    </div>

    <div class="canvas-frame">
      <canvas
        id="gpCanvas"
        width="380"
        height="540"
        tabindex="0"
        role="application"
        aria-label="Gentle Path driving journey game. Use the left and right arrow keys, or tap the left and right sides on a touchscreen."
      ></canvas>
    </div>
  </main>

  <script src="game-v2.js"></script>
</body>
</html>
